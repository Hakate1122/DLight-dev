name: DLight CLI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  php-dli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, openssl, sockets
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          if [ -f .env.test ] && [ ! -f .env ]; then cp .env.test .env; fi
          mkdir -p public/logs

      - name: Verify CLI boots
        run: |
          printf 'n\n' | php dli version
          php dli help

      - name: Run tests via DLight CLI
        run: php dli test tests/Unit --colors=never
