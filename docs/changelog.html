<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DLight Docs — Changelog</title>
</head>
<body>

  <div class="layout">

    <main class="content">
      <h1>Changelog</h1>
      <p>Mọi thay đổi đáng chú ý của DLight sẽ được ghi lại ở đây.</p>

      <div id="changelog-container">Đang tải changelog...</div>

      <div class="footer">
        Gợi ý: Nếu bạn muốn xem nội dung dạng Markdown, file nguồn là <code>docs/CHANGELOG.md</code>.
      </div>
    </main>
  </div>
  <script src="marked.min.js"></script>
  <script>
    (async function(){
      try {
        const res = await fetch('./CHANGELOG.md');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        const container = document.getElementById('changelog-container');
        container.innerHTML = marked.parse(md);
        document.querySelectorAll('#changelog-container a').forEach(a => a.target = '_blank');
      } catch (err) {
        console.error(err);
        const container = document.getElementById('changelog-container');
        if (container) container.innerText = 'Không thể tải CHANGELOG.md: ' + err.message;
      }
    })();
  </script>
</body>
</html>
